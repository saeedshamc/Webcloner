[package]
name = "webcloner"
version = "1.0.0"
edition = "2021"
description = "Clone a website (HTML/CSS/JS/images/fonts) for fully offline use — zip, local server, or standalone desktop app."
authors = ["Saeed"]

[lib]
name = "webcloner"
path = "src/lib.rs"

[[bin]]
name = "webcloner"
path = "src/main.rs"

[dependencies]
reqwest = { version = "=0.11.27", default-features = false, features = ["native-tls"] }
scraper = "=0.17.1"
url = "=2.5.0"
clap = { version = "=4.4.18", features = ["derive"] }
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
walkdir = "=2.5.0"
regex = "=1.10.4"
anyhow = "=1.0.82"
tokio = { version = "=1.37.0", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time"] }
axum = "=0.6.20"
tower-http = { version = "=0.4.4", features = ["fs"] }
mime_guess = "=2.0.4"
sha2 = "=0.10.8"
percent-encoding = "=2.3.1"
futures = "=0.3.30"
hashbrown = "=0.14.5"
indexmap = "=2.2.6"
ahash = "=0.8.11"
zerofrom = "=0.1.5"
litemap = "=0.7.4"
tinystr = "=0.7.6"
icu_normalizer = "=1.5.0"
idna_adapter = "=1.1.0"
tokio-util = "=0.7.10"

[target.'cfg(unix)'.dependencies]
openssl-sys = "=0.9.103"
openssl = "=0.10.66"

