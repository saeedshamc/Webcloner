<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="webcloner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="55%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- App icon background -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="112" height="56" rx="28" fill="url(#shine)"/>
  <!-- Globe -->
  <circle cx="52" cy="58" r="24" fill="none" stroke="#e0e7ff" stroke-width="3.5" opacity="0.95"/>
  <ellipse cx="52" cy="58" rx="10" ry="24" fill="none" stroke="#c7d2fe" stroke-width="2.2" opacity="0.85"/>
  <path d="M28 58 H76" stroke="#c7d2fe" stroke-width="2.2" opacity="0.85"/>
  <path d="M32 48 Q52 42 72 48" fill="none" stroke="#c7d2fe" stroke-width="1.8" opacity="0.7"/>
  <path d="M32 68 Q52 74 72 68" fill="none" stroke="#c7d2fe" stroke-width="1.8" opacity="0.7"/>
  <!-- Clone / mirror panel -->
  <rect x="74" y="36" width="34" height="44" rx="6" fill="#ffffff" opacity="0.92"/>
  <rect x="80" y="44" width="22" height="3" rx="1.5" fill="#6366f1"/>
  <rect x="80" y="52" width="18" height="3" rx="1.5" fill="#818cf8" opacity="0.85"/>
  <rect x="80" y="60" width="20" height="3" rx="1.5" fill="#818cf8" opacity="0.65"/>
  <rect x="80" y="68" width="14" height="3" rx="1.5" fill="#818cf8" opacity="0.45"/>
  <!-- Arrow clone -->
  <path d="M66 82 L78 82 L78 76 L88 86 L78 96 L78 90 L66 90 Z" fill="#bfdbfe"/>
  <!-- Small nodes -->
  <circle cx="38" cy="42" r="3" fill="#bfdbfe"/>
  <circle cx="64" cy="34" r="2.5" fill="#bfdbfe" opacity="0.8"/>
  <circle cx="44" cy="78" r="2.5" fill="#bfdbfe" opacity="0.8"/>
</svg>
